name=DebugLog
version=1.1.0
author=Martin Lihs
maintainer=Martin Lihs <martin@example.com>
sentence=Lightweight debug logging library with configurable log levels, ANSI color support, and stack-safe printf-style formatting for Arduino.
paragraph=Provides simple macros (LOGE, LOGW, LOGI, LOGD, LOGV) and printf-style formatting macros (LOGE_F, LOGW_F, LOGI_F, LOGD_F, LOGV_F) for different log levels with automatic timestamping and optional ANSI color output. Printf-style macros use fixed buffers to prevent stack overflow in embedded systems. Can be completely disabled for release builds to save memory and processing time.
category=Other
url=https://docs.arduino.cc/learn/contributions/arduino-creating-library-guide/
